version: '3.8'

services:
  chat-api:
    build: .
    container_name: fastapi-chat-api
    ports:
      - "8001:8001"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      # Mount .env file from host (you'll create it manually on server)
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
